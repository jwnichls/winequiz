{% extends 'base.html' %}
{% block header %}
<h1>{% block title %}Welcome!{% endblock %}</h1>
{% endblock %}
{% block content %}
<div class="container">
    {{super()}}
    <div class="row">
        <p>
            Welcome to the Wine Quiz!
        </p>
    </div>
	<div class="row">
		<form class="mt-5">
			<div class="form-group">
				<label for="formControlRange">Demo Slider 1</label>
				<input type="range" class="form-control-range sync" id="slider1" min="0" max="50" value="{{slider1}}">
			</div>
			<div class="form-group">
				<label for="formControlRange">Demo Slider 2</label>
				<input type="range" class="form-control-range sync" id="slider2" min="0" max="50" value="{{slider2}}">
			</div>
		</form>
	</div>
</div>
{% endblock %}

{% block scripts %}
{{super()}}
<script>
$(document).ready(function(){
	// sending a connect request to the server.
	var socket = io.connect('http://localhost:5000', { transports : ['websocket'] });

	// An event handler for a change of value 
	$('input.sync').on('input', function(event) {
	  socket.emit('value_changed', {
	      who:$(this).attr('id'),  
	      data: $(this).val()
	   });
	   return false;
	});

	socket.on("connect_error", function(err){
		console.log(`connect_error due to ${err.message}`);
	});

	socket.on('after_connect', function(msg){
		console.log('After connect', msg);
	});

	socket.on('update_value', function(msg){
		console.log('Slider value updated ' + msg.who + ' ' + msg.data); 
		$('#'+msg.who).val(msg.data);
	});

	socket.on('ping', function(msg){
		console.log('Ping ' + msg.value); 
	});
});
</script>
{% endblock %}
