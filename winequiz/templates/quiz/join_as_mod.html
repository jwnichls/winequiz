{% extends 'base.html' %}
{% block header %}
<h1>{% block title %}Join {{ quiz.name }} Quiz As Moderator{% endblock %}</h1>
{% endblock %}
{% block content %}
<div class="container">
    {{super()}}
    <div class="row">
		<div class="col-md-12">
	        <p>
	            Please enter your code.
	        </p>
		</div>
    </div>
	<div class="row">
		<div class="col-md-12">
		    <form action="{{ url_for('quiz.start_moderator', id=quiz.id) }}" method="POST">
		    	<div class="form-group">
		    	    <label for="moderator_code">Moderator Code</label>
		    	    <input name="moderator_code" id="moderator_code" class="form-control" required/>
		    	</div>
		    	<div class="form-group">
					<button type="submit" id="join" name="action" value="Moderate" class="btn btn-success btn-block">Moderate!</button>
				</div>
		    </form>
		</div>
	</div>
</div>
{% endblock %}

{% block scripts %}
{{super()}}
<script>
$(document).ready(function(){
});
</script>
{% endblock %}
