{% extends 'base.html' %}
{% block header %}
<h1>{% block title %}Join {{ quiz.name }} Quiz As Moderator{% endblock %}</h1>
{% endblock %}
{% block content %}
<div class="container">
    {{super()}}
    <div class="row">
        <p>
            Please enter your code.
        </p>
    </div>
	<div class="row">
	    <form action="{{ url_for('quiz.start_moderator', id=quiz.id) }}" method="POST">
	    	<div class="form-group form-inline">
	    	    <label for="moderator_code">Moderator Code</label>
	    	    <input name="moderator_code" id="moderator_code" class="form-control" required/>
				<button type="submit" id="join" name="action" value="Moderate" class="btn btn-success">Moderate!</button>
	    	</div>
	    </form>
	</div>
</div>
{% endblock %}

{% block scripts %}
{{super()}}
<script>
$(document).ready(function(){
});
</script>
{% endblock %}
