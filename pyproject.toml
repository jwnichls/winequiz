[project]
name = "winequiz"
version = "0.1.0"
description = "A multi-user wine quiz web-based game"
authors = [{ name = "Jeff Nichols", email = "jeff@jeffreynichols.com" }]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask",
    "flask-socketio",
    "flask-bootstrap",
    "flask-sqlalchemy",
    "sqlalchemy",
    "flask-migrate",
    "celery",
    "redis",
    "gunicorn",
    "gevent>=26.9.0",
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "pytest",
    "coverage",
    "pytest-cov",
    "flake8",
    "pylint",
    "black",
    "pre-commit",
    "curlylint>=0.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
